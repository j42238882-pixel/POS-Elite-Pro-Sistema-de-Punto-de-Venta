[build]
  command = "npm run build"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Redirección de rutas API hacia la Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Fallback para rutas limpias
[[redirects]]
  from = "/pos"
  to = "/pos.html"
  status = 200

[[redirects]]
  from = "/proyectoproximo"
  to = "/proyectoproximo.html"
  status = 200

# Cabeceras de seguridad y CORS
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Access-Control-Allow-Origin = "*"
